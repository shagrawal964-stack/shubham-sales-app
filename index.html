<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b70">
<title>Shubham Sales ERP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#123b70;color:white;padding:18px}
header h2{margin:0 0 5px}
main{max-width:800px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
h3{margin-top:4px}
input,select,button,textarea{width:100%;padding:12px;margin:5px 0;border-radius:8px;font-size:15px}
input,select,textarea{border:1px solid #cbd5e1;background:white;color:#172033}
button{background:#174b89;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#e4ebf5;color:#17375e}
.danger{background:#a52c2c}
nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav button{min-height:55px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#e8f0ff;padding:12px;border-radius:10px;overflow-wrap:anywhere}
.stat strong{display:block;font-size:21px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.item{padding:12px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}
.small{font-size:12px;color:#64748b}
.hidden{display:none!important}
.notice{padding:10px;background:#fff3cd;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<header>
<h2>Shubham Sales</h2>
<div>Sales • Stock • Customers • Billing</div>
</header>
<main>
<section id="login" class="card">
<h3>Admin Login</h3>
<p class="small">Demo login: admin / 1234</p>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="err" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="row">
<div><b>Shubham Sales Dashboard</b></div>
<button type="button" id="menuToggle" style="max-width:110px" aria-expanded="false" aria-controls="menuCard" onclick="toggleMenu()">☰ Menu</button>
<button type="button" style="max-width:110px" onclick="logout()">Logout</button>
</div>
<p class="notice">इस संस्करण का डेटा इसी ब्राउज़र में सेव होता है। नियमित बैकअप रखें।</p>
<div class="stats">
<div class="stat">Products<strong id="pc">0</strong></div>
<div class="stat">Customers<strong id="cc">0</strong></div>
<div class="stat">Orders<strong id="oc">0</strong></div>
<div class="stat">Total Sales<strong id="sales">₹0</strong></div>
<div class="stat">Stock Value<strong id="sv">₹0</strong></div>
<div class="stat">Customer Due<strong id="due">₹0</strong></div>
</div>
</div>
<div class="card hidden" id="menuCard">
<h3>Business Management</h3>
<nav>
<button onclick="page('products')">📦 Products</button>
<button onclick="page('stock')">🏬 Stock In/Out</button>
<button onclick="page('customers')">👥 Customers</button>
<button onclick="page('orders')">🛒 Orders</button>
<button onclick="page('billing')">🧾 Billing & Payments</button>
<button onclick="page('reports')">📊 Reports</button>
<button onclick="page('backup')">💾 Backup Data</button>
</nav>
</div>
<div id="workspace" class="card hidden"></div>
</section>
</main>
<script>
const blank=()=>({
products:[],customers:[],orders:[],bills:[],moves:[]
});
let db;
try{db=JSON.parse(localStorage.getItem("ss_erp_data"))||blank()}
catch(e){db=blank()}
["products","customers","orders","bills","moves"].forEach(k=>{
if(!Array.isArray(db[k]))db[k]=[];
});
const money=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=id=>Number(document.getElementById(id)?.value)||0;
function save(){
localStorage.setItem("ss_erp_data",JSON.stringify(db));
dashboard();
}
function login(){
if(document.getElementById("user").value==="admin"&&
document.getElementById("pass").value==="1234"){
sessionStorage.setItem("ss_erp_login","1");
openApp();
}else document.getElementById("err").textContent="Username या password गलत है";
}
function openApp(){
document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
dashboard();
page("home");
}
function toggleMenu(){
 const menu=document.getElementById("menuCard");
 const toggle=document.getElementById("menuToggle");
 if(!menu||!toggle)return;
 const willOpen=menu.classList.contains("hidden");
 menu.classList.toggle("hidden",!willOpen);
 toggle.setAttribute("aria-expanded",String(willOpen));
}
function logout(){
sessionStorage.removeItem("ss_erp_login");
document.getElementById("app").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
document.getElementById("pass").value="";
}
function dashboard(){
const billed=db.bills.reduce((s,b)=>s+b.amount,0);
const paid=db.bills.reduce((s,b)=>s+b.paid,0);
document.getElementById("pc").textContent=db.products.length;
document.getElementById("cc").textContent=db.customers.length;
document.getElementById("oc").textContent=db.orders.length;
document.getElementById("sales").textContent=money(billed);
document.getElementById("due").textContent=money(billed-paid);
document.getElementById("sv").textContent=money(db.products.reduce((s,p)=>s+p.stock*p.cost,0));
}
function opts(list,placeholder){
return '<option value="">'+placeholder+'</option>'+list.map(x=>
'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("");
}
function page(k){
const w=document.getElementById("workspace");
w.classList.remove("hidden");
if(k==="home"){w.innerHTML="<h3>Welcome!</h3>Select a management option above.";return}
if(k==="products"){
w.innerHTML=`<h3>Add Product</h3>
<form id="f">
<input name="name" required placeholder="Product name">
<input name="sku" placeholder="Product code / SKU">
<div class="row"><input name="cost" type="number" min="0" step=".01" required placeholder="Purchase price">
<input name="price" type="number" min="0" step=".01" required placeholder="Selling price"></div>
<input name="stock" type="number" min="0" step="1" required placeholder="Opening stock (pieces)">
<button>Save Product</button></form><h3>Product List</h3><div id="list"></div>`;
document.getElementById("f").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target);
const p={id:crypto.randomUUID(),name:f.get("name").trim(),sku:f.get("sku").trim(),cost:+f.get("cost"),price:+f.get("price"),stock:+f.get("stock")};
db.products.push(p);db.moves.push({date:new Date().toISOString(),name:p.name,qty:p.stock,type:"Opening stock"});
save();page(k);
};
listProducts();return;
}
if(k==="customers"){
w.innerHTML=`<h3>Add Customer</h3><form id="f">
<input name="name" required placeholder="Customer / Dealer name">
<input name="phone" placeholder="Mobile number">
<textarea name="address" placeholder="Address"></textarea>
<input name="opening" type="number" min="0" step=".01" value="0" placeholder="Old outstanding amount">
<button>Save Customer</button></form><h3>Customer Accounts</h3><div id="list"></div>`;
document.getElementById("f").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target);
db.customers.push({id:crypto.randomUUID(),name:f.get("name").trim(),phone:f.get("phone").trim(),address:f.get("address").trim(),opening:+f.get("opening")||0});
save();page(k);
};
listCustomers();return;
}
if(k==="stock"){
w.innerHTML=`<h3>Stock In / Out</h3><form id="f">
<select name="product" required>${opts(db.products,"Select product")}</select>
<select name="type"><option value="in">Stock In (+)</option><option value="out">Stock Out (-)</option></select>
<input name="qty" type="number" min="1" step="1" required placeholder="Quantity">
<input name="note" placeholder="Reason / Supplier / Reference">
<button>Update Stock</button></form><h3>Current Stock</h3><div id="list"></div><h3>Recent Movements</h3><div id="moves"></div>`;
document.getElementById("f").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target);
const p=db.products.find(x=>x.id===f.get("product")),q=+f.get("qty");
if(!p)return alert("Select a product");
if(f.get("type")==="out"&&q>p.stock)return alert("Available stock is only "+p.stock);
p.stock+=f.get("type")==="in"?q:-q;
db.moves.unshift({date:new Date().toISOString(),name:p.name,qty:q,type:f.get("type"),note:f.get("note")});
save();page(k);
};
listProducts();
document.getElementById("moves").innerHTML=db.moves.slice(0,30).map(m=>`<div class="item">${esc(m.name)} — ${m.type==="in"||m.type==="Opening stock"?"+":"−"}${m.qty} <div class="small">${esc(m.note||"")} ${new Date(m.date).toLocaleDateString()}</div></div>`).join("")||"No movements";
return;
}
if(k==="orders"){
w.innerHTML=`<h3>Create Order</h3><form id="f">
<select name="customer" required>${opts(db.customers,"Select customer")}</select>
<select name="product" required>${opts(db.products,"Select product")}</select>
<input name="qty" type="number" min="1" step="1" required placeholder="Quantity">
<input name="note" placeholder="Order note">
<button>Create Order & Reserve Stock</button></form><h3>Orders</h3><div id="list"></div>`;
document.getElementById("f").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target);
const p=db.products.find(x=>x.id===f.get("product"));
const c=db.customers.find(x=>x.id===f.get("customer")),q=+f.get("qty");
if(!p||!c)return alert("Select customer and product");
if(q>p.stock)return alert("Insufficient stock. Available: "+p.stock);
p.stock-=q;
const o={id:crypto.randomUUID(),customerId:c.id,customer:c.name,productId:p.id,product:p.name,qty:q,price:p.price,amount:q*p.price,note:f.get("note"),status:"Pending billing",date:new Date().toISOString()};
db.orders.unshift(o);
db.moves.unshift({date:new Date().toISOString(),name:p.name,qty:q,type:"Order reserved"});
save();page(k);
};
listOrders();return;
}
if(k==="billing"){
w.innerHTML=`<h3>Billing & Payment</h3><form id="f">
<select name="order" required>${'<option value="">Select unbilled order</option>'+db.orders.filter(o=>!db.bills.some(b=>b.orderId===o.id)).map(o=>`<option value="${esc(o.id)}">${esc(o.customer)} — ${esc(o.product)} × ${o.qty} (${money(o.amount)})</option>`).join("")}</select>
<input name="discount" type="number" min="0" step=".01" value="0" placeholder="Discount">
<input name="paid" type="number" min="0" step=".01" value="0" placeholder="Amount received now">
<select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option><option>Credit</option></select>
<button>Create Bill</button></form>
<h3>Record Further Payment</h3>
<form id="pay"><select name="bill" required>${'<option value="">Select customer bill</option>'+db.bills.filter(b=>b.paid<b.amount).map(b=>`<option value="${esc(b.id)}">${esc(b.customer)} — Due ${money(b.amount-b.paid)}</option>`).join("")}</select>
<input name="amount" type="number" min=".01" step=".01" required placeholder="Payment amount">
<button>Record Payment</button></form><h3>Bills</h3><div id="list"></div>`;
document.getElementById("f").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target);
const o=db.orders.find(x=>x.id===f.get("order"));
if(!o)return alert("Select an order");
const discount=+f.get("discount"),paid=+f.get("paid"),amount=o.amount-discount;
if(discount>o.amount||paid>amount)return alert("Check discount and payment");
const b={id:crypto.randomUUID(),orderId:o.id,customerId:o.customerId,customer:o.customer,amount,paid,method:f.get("method"),date:new Date().toISOString()};
db.bills.unshift(b);o.status="Billed";save();page(k);
};
document.getElementById("pay").onsubmit=e=>{
e.preventDefault();const f=new FormData(e.target),b=db.bills.find(x=>x.id===f.get("bill")),a=+f.get("amount");
if(!b||a<=0||a>b.amount-b.paid)return alert("Payment amount exceeds outstanding balance");
b.paid+=a;b.payments=b.payments||[];b.payments.push({amount:a,date:new Date().toISOString()});
save();page(k);
};
listBills();return;
}
if(k==="reports"){
w.innerHTML=`<h3>Business Reports</h3>
<div class="item">Total billed: <b>${money(db.bills.reduce((s,b)=>s+b.amount,0))}</b></div>
<div class="item">Payments received: <b>${money(db.bills.reduce((s,b)=>s+b.paid,0))}</b></div>
<div class="item">Outstanding (new bills): <b>${money(db.bills.reduce((s,b)=>s+b.amount-b.paid,0))}</b></div>
<h3>Low Stock (5 or fewer)</h3>${db.products.filter(p=>p.stock<=5).map(p=>`<div class="item">${esc(p.name)}: ${p.stock} pcs</div>`).join("")||"No low-stock items"}
<h3>Customer Outstanding</h3>${db.customers.map(c=>`<div class="item">${esc(c.name)}: <b>${money(customerDue(c.id))}</b></div>`).join("")||"No customers"}
<h3>Stock Summary</h3>${db.products.map(p=>`<div class="item">${esc(p.name)} — ${p.stock} pcs</div>`).join("")||"No products"}`;
return;
}
if(k==="backup"){
w.innerHTML=`<h3>Backup & Restore</h3><p>अपने डेटा की JSON कॉपी डाउनलोड करें।</p>
<button id="export">Download Backup</button>
<h3>Restore Backup</h3><input id="file" type="file" accept=".json,application/json">
<button class="secondary" id="restore">Restore selected file</button>
<p class="small">Restore करने पर वर्तमान डेटा बदल जाएगा। पहले बैकअप लें।</p>`;
document.getElementById("export").onclick=()=>{
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
a.href=url;a.download="shubham-sales-backup.json";a.click();URL.revokeObjectURL(url);
};
document.getElementById("restore").onclick=()=>{
const file=document.getElementById("file").files[0];if(!file)return alert("Choose a backup file");
const r=new FileReader();r.onload=()=>{
try{const d=JSON.parse(r.result);
if(!["products","customers","orders","bills","moves"].every(k=>Array.isArray(d[k])))throw Error();
if(!confirm("Replace current data with this backup?"))return;
db=d;save();page("home");alert("Backup restored");
}catch(e){alert("Invalid backup file")}
};r.readAsText(file);
};
}
}
function listProducts(){
const el=document.getElementById("list");if(!el)return;
el.innerHTML=db.products.map(p=>`<div class="item"><b>${esc(p.name)}</b> ${p.sku?"("+esc(p.sku)+")":""}<br>Stock: ${p.stock} | Purchase: ${money(p.cost)} | Sale: ${money(p.price)}<button class="secondary" onclick="editStock('${p.id}')">Quick stock change</button></div>`).join("")||"No products yet";
}
function editStock(id){
const p=db.products.find(x=>x.id===id);if(!p)return;
const value=prompt("Enter new total stock for "+p.name,p.stock);
if(value===null)return;const q=Number(value);
if(!Number.isInteger(q)||q<0)return alert("Enter a valid non-negative whole number");
const diff=q-p.stock;p.stock=q;
if(diff)db.moves.unshift({date:new Date().toISOString(),name:p.name,qty:Math.abs(diff),type:diff>0?"in":"out",note:"Quick adjustment"});
save();page("stock");
}
function customerDue(id){
const c=db.customers.find(x=>x.id===id);
return (c?.opening||0)+db.bills.filter(b=>b.customerId===id).reduce((s,b)=>s+b.amount-b.paid,0);
}
function listCustomers(){
const el=document.getElementById("list");if(!el)return;
el.innerHTML=db.customers.map(c=>`<div class="item"><b>${esc(c.name)}</b><br>${esc(c.phone)}<br>${esc(c.address)}<br>Outstanding: <b>${money(customerDue(c.id))}</b></div>`).join("")||"No customers yet";
}
function listOrders(){
const el=document.getElementById("list");if(!el)return;
el.innerHTML=db.orders.map(o=>`<div class="item"><b>${esc(o.customer)}</b><br>${esc(o.product)} × ${o.qty}<br>${money(o.amount)} — ${esc(o.status)}<div class="small">${new Date(o.date).toLocaleString()}</div></div>`).join("")||"No orders yet";
}
function listBills(){
const el=document.getElementById("list");if(!el)return;
el.innerHTML=db.bills.map(b=>`<div class="item"><b>${esc(b.customer)}</b><br>Bill: ${money(b.amount)}<br>Paid: ${money(b.paid)}<br>Due: <b>${money(b.amount-b.paid)}</b><br>Method: ${esc(b.method)}<div class="small">${new Date(b.date).toLocaleDateString()}</div><button class="secondary" onclick="printBill('${b.id}')">Print Bill</button></div>`).join("")||"No bills yet";
}
function printBill(id){
const b=db.bills.find(x=>x.id===id);if(!b)return;
const o=db.orders.find(x=>x.id===b.orderId);
const c=db.customers.find(x=>x.id===b.customerId);
const win=window.open("","_blank");
if(!win)return alert("Allow pop-ups to print bills");
win.document.write(`<html><head><title>Shubham Sales Invoice</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #888;padding:10px;text-align:left}</style></head><body><h2>Shubham Sales</h2><h3>Invoice</h3><p>Date: ${new Date(b.date).toLocaleDateString()}</p><p>Customer: ${esc(b.customer)}</p><p>Mobile: ${esc(c?.phone||"")}</p><table><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr><tr><td>${esc(o?.product||"")}</td><td>${o?.qty||0}</td><td>${money(o?.price)}</td><td>${money(o?.amount)}</td></tr></table><p>Discount: ${money((o?.amount||0)-b.amount)}</p><h3>Net Bill: ${money(b.amount)}</h3><p>Paid: ${money(b.paid)}</p><p>Balance: ${money(b.amount-b.paid)}</p><button onclick="window.print()">Print / Save PDF</button></body></html>`);
win.document.close();
}
if(sessionStorage.getItem("ss_erp_login")==="1")openApp();
</script>
</body>
</html>
