<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham Sales Pro - Preview</title>
    <!-- आपके स्क्रीनशॉट की थीम पर आधारित फोंट्स और आइकन्स -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #3b28b7 0%, #8e2de2 100%);
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --border-radius: 16px;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background-color: #f7f9fc;
            color: #333;
        }
        /* हेडर (स्क्रीनशॉट के अनुसार) */
        .app-header {
            background: var(--primary-bg);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-circle {
            background: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #3b28b7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .business-info h2 { margin: 0; font-size: 18px; }
        .business-info p { margin: 0; font-size: 11px; opacity: 0.8; }
        
        /* रोल सिम्युलेटर विजेट */
        .role-selector {
            background: #fff;
            padding: 12px;
            margin: 15px;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-around;
            border: 2px dashed #8e2de2;
        }
        .role-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .role-btn.active { background: #3b28b7; color: white; }

        /* मुख्य कंटेनर */
        .container { padding: 0 15px 80px 15px; }

        /* कैटलॉग कार्ड्स ग्रिड */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .product-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--card-shadow);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .image-container {
            width: 100%;
            height: 140px;
            background: #eaeaea;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .download-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #3b28b7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .product-details { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; gap: 5px;}
        .p-name { font-weight: 600; font-size: 14px; margin: 0; }
        .p-size { font-size: 11px; color: #777; margin: 0; }
        .price-section { margin-top: 5px; }
        .price-input {
            width: 80%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-weight: bold;
            color: #333;
        }
        .discount-container {
            display: none;
            margin-top: 8px;
            gap: 5px;
        }
        .discount-btn {
            flex: 1;
            padding: 4px;
            font-size: 11px;
            border: 1px solid #3b28b7;
            background: white;
            color: #3b28b7;
            border-radius: 4px;
            cursor: pointer;
        }
        .discount-btn.selected { background: #3b28b7; color: white; }

        /* शेयर और पीडीएफ फुटर */
        .footer-actions {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 12px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            box-sizing: border-box;
        }
        .action-btn {
            width: 45%;
            padding: 10px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .pdf-btn { background: #e74c3c; }
        .wp-btn { background: #2ecc71; }
    </style>
</head>
<body>

    <!-- ऐप टॉप बार -->
    <div class="app-header">
        <div class="brand-section">
            <div class="logo-circle">S</div>
            <div class="business-info">
                <h2>Shubham Sales</h2>
                <p><i class="fa-solid fa-location-dot"></i> Gogunda, Rajasthan | <i class="fa-solid fa-phone"></i> +91 XXXXX XXXXX</p>
            </div>
        </div>
        <i class="fa-solid fa-bars" style="font-size: 20px;"></i>
    </div>

    <!-- रोल सिम्युलेटर (एडमिन बनाम स्टाफ टेस्टिंग के लिए) -->
    <div class="role-selector">
        <span><strong>टेस्ट रोल चुनें:</strong></span>
        <button class="role-btn active" onclick="switchRole('admin')">Admin (आप)</button>
        <button class="role-btn" onclick="switchRole('staff')">Staff (कर्मचारी)</button>
    </div>

    <!-- मुख्य प्रोडक्ट कैटलॉग ग्रिड -->
    <div class="container">
        <h3>📦 डिजिटल प्रोडक्ट कैटलॉग</h3>
        
        <div class="catalog-grid">
            <!-- प्रोडक्ट 1 -->
            <div class="product-card">
                <div class="image-container">
                    <img src="https://unsplash.com" alt="Product">
                    <!-- मूल क्वालिटी डाउनलोड बटन -->
                    <button class="download-btn" onclick="downloadImage('https://unsplash.com')" title="ओरिजिनल क्वालिटी डाउनलोड करें">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
                <div class="product-details">
                    <p class="p-name">Premium Sports Shoes</p>
                    <p class="p-size">Size: 9 UK | Qty: 15</p>
                    <div class="price-section">
                        <label style="font-size: 10px; display:block; color:#666;">सेल प्राइस (₹):</label>
                        <input type="number" class="price-input" value="2499" id="price-1">
                    </div>
                    <!-- स्टाफ डिस्काउंट लिमिटर्स (10% और 20%) -->
                    <div class="discount-container" id="disc-box-1">
                        <button class="discount-btn" onclick="applyDiscount(1, 10, 2499)">-10%</button>
                        <button class="discount-btn" onclick="applyDiscount(1, 20, 2499)">-20%</button>
                    </div>
                </div>
            </div>

            <!-- प्रोडक्ट 2 -->
            <div class="product-card">
                <div class="image-container">
                    <img src="https://unsplash.com" alt="Product">
                    <button class="download-btn" onclick="downloadImage('https://unsplash.com')">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
                <div class="product-details">
                    <p class="p-name">Wireless Headphones</p>
                    <p class="p-size">Size: Standard | Qty: 40</p>
                    <div class="price-section">
                        <label style="font-size: 10px; display:block; color:#666;">सेल संज्ञा (₹):</label>
                        <input type="number" class="price-input" value="1800" id="price-2">
                    </div>
                    <div class="discount-container" id="disc-box-2">
                        <button class="discount-btn" onclick="applyDiscount(2, 10, 1800)">-10%</button>
                        <button class="discount-btn" onclick="applyDiscount(2, 20, 1800)">-20%</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- शेयरिंग एक्शन्स -->
    <div class="footer-actions">
        <button class="action-btn pdf-btn" onclick="alert('कैटलॉग PDF जनरेट हो रहा है...')"><i class="fa-solid fa-file-pdf"></i> Get PDF</button>
        <button class="action-btn wp-btn" onclick="alert('व्हाट्सएप पर शेयर किया जा रहा है...')"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
    </div>

    <!-- सुरक्षा लॉजिक स्क्रिप्ट -->
    <script>

        function switchRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
